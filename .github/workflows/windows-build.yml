name: Windows installer

# The build is heavy and downloads a Node runtime, so it does not run on every
# push. It runs when a pull request touches the packaging, and on demand.
#
# Running it by hand can also publish a GitHub Release carrying the installer.
on:
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release with the installer'
        type: boolean
        default: false
      tag:
        description: 'Release tag. Leave empty for v<version from package.json>'
        type: string
        default: ''
      draft:
        description: 'Create it as a draft, so you can read it before it goes out'
        type: boolean
        default: false
      prerelease:
        description: 'Mark it as a prerelease'
        type: boolean
        default: false

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer:
    name: Build the setup EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "version $version"

      - name: Stage the payload
        shell: pwsh
        run: .\windows\build\prepare.ps1

      # Use the staged helper and bundled Node, as the installed service does.
      # GitHub's Windows runner is disposable and elevated for machine trust tests.
      - name: Test the staged HTTPS certificate
        shell: powershell
        run: |
          & .\windows\stage\runtime\node.exe --test windows/tests/certificate-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows certificate smoke test failed' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Compile the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe was not found at $iscc" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" "windows\installer\tally-mcp.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Report what was produced
        shell: pwsh
        run: |
          Get-ChildItem build-output -Filter *.exe | ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              Write-Host ("{0}  {1:N1} MB  {2}" -f $_.Name, ($_.Length / 1MB), $hash)
          }

      - name: Upload the setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: setup
          path: build-output/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish the release
    needs: installer
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: ubuntu-latest

    permissions:
      # the only job that writes anything back to the repository
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Collect the installer
        uses: actions/download-artifact@v4
        with:
          name: setup
          path: installers

      - name: Work out the tag
        id: meta
        env:
          # through the environment, so a tag with a quote in it cannot break
          # out of the script
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="$TAG_INPUT"
          [ -n "$tag" ] || tag="v$version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release $tag for version $version"

      # written before the notes, so its digest is the one the notes quote
      - name: Write the checksum file
        working-directory: installers
        run: |
          set -euo pipefail
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build the release notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          python3 windows/build/render-release-notes.py \
            --version "$VERSION" \
            --tag "$TAG" \
            --repo-url "$REPO_URL" \
            --installer-dir installers \
            --out release-notes.md
          cat release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ github.sha }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          # written as ifs, not 'test && flags+=', because under set -e a false
          # test on the last line of that form ends the whole step
          flags=()
          if [ "$DRAFT" = 'true' ]; then flags+=(--draft); fi
          if [ "$PRERELEASE" = 'true' ]; then flags+=(--prerelease); fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # a re-run replaces what is there rather than failing on the tag
            echo "$TAG exists, replacing its notes and assets"
            gh release edit "$TAG" \
              --title "Tally MCP Server $VERSION for Windows" \
              --notes-file release-notes.md
            gh release upload "$TAG" installers/* --clobber
          else
            gh release create "$TAG" installers/* \
              --target "$TARGET" \
              --title "Tally MCP Server $VERSION for Windows" \
              --notes-file release-notes.md \
              "${flags[@]}"
          fi

          echo "Released: $(gh release view "$TAG" --json url --jq .url)"
