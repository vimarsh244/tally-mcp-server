name: Windows installer

# The build is heavy and downloads a Node runtime, so it does not run on every
# push. It runs when a pull request touches the packaging, and on demand.
on:
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Attach the setup EXE to the run as an artifact'
        type: boolean
        default: true

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer:
    name: Build the setup EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "version $version"

      - name: Stage the payload
        shell: pwsh
        run: .\windows\build\prepare.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Compile the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe was not found at $iscc" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" "windows\installer\tally-mcp.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Report what was produced
        shell: pwsh
        run: Get-ChildItem build-output | Format-Table Name, @{ Name = 'MB'; Expression = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Upload the setup EXE
        if: github.event_name != 'workflow_dispatch' || inputs.upload
        uses: actions/upload-artifact@v4
        with:
          name: TallyMcpServer-Setup-${{ steps.version.outputs.value }}
          path: build-output/*.exe
          if-no-files-found: error
          retention-days: 30
